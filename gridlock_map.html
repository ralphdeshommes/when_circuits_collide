const COLORS = {
  DESC: getCSS('--desc'), GPC: getCSS('--gpc'), ITS: getCSS('--its'),
  verified: getCSS('--verified'), needs_check: getCSS('--needs')
};
function getCSS(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ============================================================================
   MAP  - base layer, then two panes so overlap lines always sit on top of
   project lines regardless of the order we add them.
   ========================================================================= */
const map = L.map('map', { center: DATA.center, zoom: DATA.zoom, zoomControl: true });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

map.createPane('projects');  map.getPane('projects').style.zIndex = 410;
map.createPane('overlaps');  map.getPane('overlaps').style.zIndex = 420;

/* ============================================================================
   PROJECTS  - a line between the two endpoints when both are known, otherwise
   a single dot at the one endpoint we have. Projects that take part in no
   overlap are drawn faded so the overlapping ones stand out.
   ========================================================================= */
const FADED = 0.18, NORMAL = 0.85;
const projectLayers = {};   // project_id -> Leaflet layer

DATA.projects.forEach(p => {
  const color = COLORS[p.group];
  const layer = (p.a && p.b)
    ? L.polyline([p.a, p.b], { pane: 'projects', color, weight: 3, opacity: NORMAL })
    : L.circleMarker(p.a || p.b, { pane: 'projects', radius: 5, color,
                                   fillColor: color, fillOpacity: 0.9, weight: 2 });
  layer.bindPopup(projectPopup(p));
  layer.addTo(map);
  projectLayers[p.id] = layer;
});

/* Popup for a project: everything needed to trace it back to the source PDF. */
function projectPopup(p) {
  const ends = p.name_b ? `${esc(p.name_a)} &rarr; ${esc(p.name_b)}`
                        : `${esc(p.name_a || p.name_b)} (single endpoint)`;
  return `<div class="pop-title">${esc(p.name)}</div>
    ${row('Project ID', p.id)}
    ${row('Utility', p.utility)}
    ${row('Endpoints', ends, true)}
    ${row('Cost', costLine(p), true)}
    ${row('In service', p.date)}
    ${row('Status', p.status)}
    ${row('Confidence', confLabel(p.confidence))}
    ${row('Overlaps', p.overlaps)}
    <div class="pop-src"><b>Source:</b> ${esc(p.source || 'n/a')}
      ${p.source_id ? ' &middot; entry ' + esc(p.source_id) : ''}</div>`;
}

/* Cost line for a project popup. DESC publishes per-project totals; Georgia
   Power redacts them in its public IRP, so we say so rather than showing a
   blank that reads like missing data. */
function costLine(p) {
  if (p.cost === null) {
    return p.cost_redacted
      ? '<span class="cost-redacted">redacted in public filing</span>'
      : '<span class="cost-redacted">not published</span>';
  }
  const money = '$' + p.cost.toLocaleString('en-US');
  return p.cost_note
    ? `${money} <span class="cost-flag" title="${esc(p.cost_note)}">note</span>`
      + `<div class="cost-note">${esc(p.cost_note)}</div>`
    : money;
}

/* ============================================================================
   OVERLAP PAIRS  - a line between the two project centers. Dashed and amber
   when at least one side is still an automatic match; solid, thicker and
   green when both sides are verified.
   ========================================================================= */
const overlapLayers = {};   // overlap rank -> Leaflet layer

DATA.overlaps.forEach(o => {
  const verified = o.confidence === 'verified';
  const line = L.polyline([o.a_center, o.b_center], {
    pane: 'overlaps',
    color: verified ? COLORS.verified : COLORS.needs_check,
    weight: verified ? 5 : 3,
    opacity: 0.9,
    dashArray: verified ? null : '7,6'    // dashed = needs checking
  });
  line.bindPopup(overlapPopup(o));
  line.on('click', () => select(o.rank, false));
  overlapLayers[o.rank] = line;
});

function overlapPopup(o) {
  return `<div class="pop-title">Rank ${o.rank} &middot; score ${o.score.toFixed(3)}</div>
    ${row('Distance', o.miles.toFixed(2) + ' mi between centers')}
    ${row('Time gap', o.gap_days + ' days')}
    ${row('Pair status', o.confidence === 'verified'
        ? 'Verified on both sides' : 'Needs checking')}
    <div class="pop-src" style="border-top:none;padding-top:8px;color:var(--ink)">
      <div><b>${esc(o.a_id)}</b> &middot; ${esc(o.a_util)} &middot; ${esc(o.a_date)}<br>${esc(o.a_name)}</div>
      <div style="margin-top:6px"><b>${esc(o.b_id)}</b> &middot; ${esc(o.b_util)} &middot; ${esc(o.b_date)}<br>${esc(o.b_name)}</div>
    </div>
    ${estimateBlock(o)}`;
}

/* Coordination estimate. Only the pair we costed carries one, and it is
   deliberately labelled illustrative: the underlying project costs are not
   public (Georgia Power redacts them) so the figure rests on assumptions. */
function estimateBlock(o) {
  if (!o.estimate) return '';
  const e = o.estimate;
  return `<div class="est">
    <div class="est-head">Coordination opportunity
      <span class="est-tag">illustrative</span></div>
    <div class="est-num">${esc(e.range)}</div>
    <div class="est-basis">${esc(e.basis)}</div>
    <div class="est-why">${esc(e.note)}</div>
    <div class="est-retro">${esc(e.retro)}</div>
    <div class="est-caveat">${esc(e.caveat)}</div>
  </div>`;
}

/* ============================================================================
   FILTERS  - the distance slider and the verified-only toggle. Both decide
   which pairs are visible; a project is only drawn at full strength if it
   still takes part in a visible pair.
   ========================================================================= */
const slider = document.getElementById('miles');
const miOut  = document.getElementById('miOut');
const onlyV  = document.getElementById('onlyVerified');
let selected = null;

function visibleOverlaps() {
  const maxMi = +slider.value;
  return DATA.overlaps.filter(o =>
    o.miles <= maxMi && (!onlyV.checked || o.confidence === 'verified'));
}

function applyFilters() {
  miOut.textContent = slider.value;
  const shown = visibleOverlaps();
  const live = new Set();                      // projects still in a visible pair
  shown.forEach(o => { live.add(o.a_id); live.add(o.b_id); });

  // show/hide the overlap lines
  DATA.overlaps.forEach(o => {
    const on = shown.includes(o);
    const layer = overlapLayers[o.rank];
    if (on && !map.hasLayer(layer)) layer.addTo(map);
    if (!on && map.hasLayer(layer)) map.removeLayer(layer);
  });

  // fade the projects that are not involved
  DATA.projects.forEach(p => {
    const op = live.has(p.id) ? NORMAL : FADED;
    const layer = projectLayers[p.id];
    if (layer.setStyle) layer.setStyle({ opacity: op, fillOpacity: op });
  });

  renderList(shown);
}

/* ============================================================================
   SIDEBAR LIST  - ranked best-first. Clicking a row zooms the map to that pair.
   ========================================================================= */
function renderList(shown) {
  const total = DATA.overlaps.length;
  const nv = shown.filter(o => o.confidence === 'verified').length;
  document.getElementById('count').innerHTML =
    `<b>${shown.length}</b> of ${total} pairs shown &middot; ${nv} verified &middot; ${shown.length - nv} need checking`;

  const list = document.getElementById('list');
  if (!shown.length) { list.innerHTML = '<div class="empty">No pairs match these filters.</div>'; return; }

  list.innerHTML = shown.map(o => {
    const color = o.confidence === 'verified' ? COLORS.verified : COLORS.needs_check;
    return `<div class="item${selected === o.rank ? ' sel' : ''}" data-rank="${o.rank}"
                 style="border-left-color:${color}">
      <div class="top"><span>#${o.rank} &middot; score ${o.score.toFixed(3)}</span>
        <span class="badge" style="background:${color}">${o.confidence === 'verified' ? 'verified' : 'check'}</span></div>
      <div class="meta">${o.miles.toFixed(2)} mi apart &middot; ${o.gap_days} days between in-service dates</div>
      <div class="names"><b>${esc(o.a_id)}</b> ${esc(o.a_name)}<br><b>${esc(o.b_id)}</b> ${esc(o.b_name)}</div>
      ${o.estimate ? `<div class="est-chip">Coordination estimate ${esc(o.estimate.range)}</div>` : ''}
    </div>`;
  }).join('');

  list.querySelectorAll('.item').forEach(el =>
    el.addEventListener('click', () => select(+el.dataset.rank, true)));
}

/* Zoom to a pair and open its popup. */
function select(rank, fromList) {
  selected = rank;
  const o = DATA.overlaps.find(x => x.rank === rank);
  const layer = overlapLayers[rank];
  if (!map.hasLayer(layer)) layer.addTo(map);      // reveal it even if filtered out
  // animate:false makes this jump straight to the pair. Leaflet's animated
  // fit depends on a transitionend event that does not always fire, which
  // left the map sitting at the default zoom; an instant jump always lands.
  map.fitBounds(L.latLngBounds([o.a_center, o.b_center]).pad(0.6),
                { maxZoom: 12, animate: false });
  if (fromList) layer.openPopup();
  renderList(visibleOverlaps());
}

/* ============================================================================
   LEGEND
   ========================================================================= */
document.getElementById('legend').innerHTML = `
  <div class="row"><span class="swatch" style="border-top-color:${COLORS.DESC}"></span> Dominion Energy South Carolina</div>
  <div class="row"><span class="swatch" style="border-top-color:${COLORS.GPC}"></span> Georgia Power</div>
  <div class="row"><span class="swatch" style="border-top-color:${COLORS.ITS}"></span> Georgia ITS partners (GTC, MEAG, Dalton)</div>
  <div class="row" style="margin-top:8px"><span class="swatch" style="border-top-color:${COLORS.verified};border-top-width:5px"></span> Overlap, verified both sides</div>
  <div class="row"><span class="swatch" style="border-top-color:${COLORS.needs_check};border-top-style:dashed"></span> Overlap, needs checking</div>
  <div class="row" style="margin-top:8px;color:var(--muted)"><span class="dot" style="background:var(--muted)"></span> Faded = project has no overlap</div>`;

/* ---- helpers ---- */
function row(k, v, raw) {
  if (v === null || v === undefined || v === '') return '';
  return `<div class="pop-row"><span class="k">${k}</span><span>${raw ? v : esc(v)}</span></div>`;
}
function confLabel(c) {
  return ({ sponsor_verified: 'Sponsor verified', manually_verified: 'Manually verified' })[c] || c;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---- wire up and draw ---- */
slider.addEventListener('input', applyFilters);
onlyV.addEventListener('change', applyFilters);
applyFilters();
</script>
